<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FAVICON -->
    <link rel="icon" type="image/jpeg" href="../css/imagenes/logo.jpg">
    
    <title>Sitio No Encontrado - ControlPass SENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            border-top: 6px solid #39A900;
        }
        h1 {
            color: #00324D;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #39A900;
            color: #ffffff;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: #2e8800;
        }
        .logo-text {
            font-weight: 700;
            color: #39A900;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ajustes específicos para celulares muy pequeños */
        @media (max-width: 480px) {
            .error-container {
                padding: 25px 15px;
            }
            h1 {
                font-size: 20px;
            }
            p {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo-text">ControlPass SENA</div>
        <h1>El Sitio o la Página No Existe</h1>
        <p>Lo sentimos, esta página o sitio no existe, la dirección es incorrecta o no está disponible en el sistema.</p>
        <!-- CORREGIDO: Apunta directo a la ruta raíz de tu repositorio en localhost -->
        <a href="/Controlpass-repo/" class="btn">Regresar al Inicio</a>
    </div>
</body>
</html>
